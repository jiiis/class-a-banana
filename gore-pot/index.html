<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gore Pot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="960" height="540"></canvas>

    <div id="hud">
      <div class="left">
        <div class="bar"><div id="hp" class="fill"></div><span id="hpText">100</span></div>
        <div id="weapon"><span id="weaponName">Pistol</span> <b id="ammo">∞</b></div>
      </div>
      <div class="mid"><span class="label">WAVE</span><b id="wave">0</b></div>
      <div class="right">
        <div><span class="label">SCORE</span><b id="score">0</b></div>
        <button id="mute" class="icon-btn" title="Sound on/off">🔊</button>
      </div>
    </div>

    <div id="overlay">
      <h1 id="title">GORE POT</h1>
      <p id="subtitle">The city's gone rotten. Vinnie's got a tommy gun and a box of cannoli.</p>
      <div class="keys">
        <span><kbd>A</kbd><kbd>D</kbd> move</span>
        <span><kbd>W</kbd> / <kbd>Space</kbd> jump</span>
        <span><kbd>Mouse</kbd> aim &amp; shoot</span>
        <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> weapons</span>
        <span><kbd>S</kbd> drop through</span>
      </div>
      <button id="start">Start</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
